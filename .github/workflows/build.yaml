name: build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checks-out repository
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: Fetching node modules
        run: pnpm install
      - name: Build distributable
        run: pnpm build
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: "dist"
          path: |
            dist/
  release:
    needs:
      - build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - name: Gathering artifacts
        run: |
          cd artifacts
          for name in *
          do
              tar -cJvf ../$name.tar.xz -C $name/ .
          done
          cd ..
          rm -rf artifacts
      - name: Release
        run: |
          if gh release view latest > /dev/null 2>&1
          then
              gh release delete latest --cleanup-tag --yes
          fi
          gh release create latest *.tar.xz \
              --target "$GITHUB_SHA" \
              --title "latest" \
              --notes "Automated build of $GITHUB_SHA"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
